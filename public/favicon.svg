<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8ECFF" />
      <stop offset="40%" stop-color="#D147FF" />
      <stop offset="70%" stop-color="#9D00FF" />
      <stop offset="100%" stop-color="#020005" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0436" />
      <stop offset="50%" stop-color="#0B011A" />
      <stop offset="100%" stop-color="#020005" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#020005" />
  <!-- Obsidian Facets -->
  <polygon points="32,6 56,32 32,58 8,32" fill="url(#diamondGrad)" stroke="#9D00FF" stroke-width="1.5" />
  <polygon points="32,14 48,32 32,50 16,32" fill="#0B011A" stroke="#D147FF" stroke-width="0.75" opacity="0.8" />
  <line x1="32" y1="6" x2="32" y2="58" stroke="#9D00FF" stroke-width="0.8" opacity="0.6" />
  <line x1="8" y1="32" x2="56" y2="32" stroke="#9D00FF" stroke-width="0.8" opacity="0.6" />
  <!-- Glowing Violet Iris Core -->
  <circle cx="32" cy="32" r="10" fill="url(#irisGlow)" />
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="7" stroke="#F8ECFF" stroke-width="0.8" opacity="0.8" />
</svg>
